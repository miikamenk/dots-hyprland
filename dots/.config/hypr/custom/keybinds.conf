#!
##! User
bindd = Super, A, Toggle overview/launcher, global, quickshell:overviewWorkspacesToggle # Toggle overview/launcher
bind = Ctrl+Super, Slash, exec, kitty nvim ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Plus, exec, kitty nvim ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds
bind = Super, Y, exec, /home/menk/.config/toggle-hdr.sh # toggle HDR
bind = Super, W, togglefloating # Toggle floating


bind = Super+Alt, O, global, quickshell:sidebarLeftToggleDetach # [hidden]

bindd = Super, J, Window Management toggle split, togglesplit # Toggle split

bindd = Super, Apostrophe, Toggle bar, global, quickshell:barToggle # Toggle bar

bindd = Super, Plus, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet

bind = Super, B, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser
bind = Super+Alt, R, exec, ~/.config/hypr/custom/scripts/layout-switch.sh # switch layouts
bind = Super, U, layoutmsg, colresize +0.1
bind = Super, I, layoutmsg, colresize -0.1
bind = Super, R, layoutmsg, colresize 1.0

#bind = Super, Up, layoutmsg, focus u # [hidden]
#bind = Super, Down, layoutmsg, focus d # [hidden]
#bind = Super, Left, layoutmsg, focus l # [hidden]
#bind = Super, Right, layoutmsg, focus r # [hidden]
#bind = Super, Up, cyclenext # [hidden]
#bind = Super, Down, cyclenext, prev # [hidden]
#bind = Super, Left, cyclenext, prev # [hidden]
#bind = Super, Right, cyclenext # [hidden]

