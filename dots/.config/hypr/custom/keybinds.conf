# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
# turn off redundant/non-useful stuff and rebind them
unbind = Super, Super_L
unbind = Super, Super_R
unbind = Super, A
unbind = Super, W
unbind = Super+Alt, R
unbind = Ctrl+Alt, R
unbind = Super+Shift+Alt, R
unbind = Super+Shift+Alt, R
unbind = Super+Shift+Alt, R

bind = Super, A, global, quickshell:overviewToggleRelease # [hidden] Toggle overview/launcher
bind = Ctrl+Super, Slash, exec, kitty nvim ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Plus, exec, kitty nvim ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds
bind = Super, Y, exec, /home/menk/.config/toggle-hdr.sh
bind = Super, W, togglefloating

unbind = Super+Shift, code:10
unbind = Super+Shift, code:11
unbind = Super+Shift, code:12
unbind = Super+Shift, code:13
unbind = Super+Shift, code:14
unbind = Super+Shift, code:15
unbind = Super+Shift, code:16
unbind = Super+Shift, code:17
unbind = Super+Shift, code:18
unbind = Super+Shift, code:19

unbind = Super+Shift, code:87
unbind = Super+Shift, code:88
unbind = Super+Shift, code:89
unbind = Super+Shift, code:83
unbind = Super+Shift, code:84
unbind = Super+Shift, code:85
unbind = Super+Shift, code:79
unbind = Super+Shift, code:80
unbind = Super+Shift, code:81
unbind = Super+Shift, code:90

unbind = Super+Alt, code:10
unbind = Super+Alt, code:11
unbind = Super+Alt, code:12
unbind = Super+Alt, code:13
unbind = Super+Alt, code:14
unbind = Super+Alt, code:15
unbind = Super+Alt, code:16
unbind = Super+Alt, code:17
unbind = Super+Alt, code:18
unbind = Super+Alt, code:19

unbind = Super+Alt, code:87
unbind = Super+Alt, code:88
unbind = Super+Alt, code:89
unbind = Super+Alt, code:83
unbind = Super+Alt, code:84
unbind = Super+Alt, code:85
unbind = Super+Alt, code:79
unbind = Super+Alt, code:80
unbind = Super+Alt, code:81
unbind = Super+Alt, code:90

unbind = Super+Alt, A
bind = Super+Alt, O, global, quickshell:sidebarLeftToggleDetach # [hidden]

unbind = Super, B
bind = Super, W, global, quickshell:sidebarLeftToggle # [hidden]

unbind = Super, J
bindd = Super, Apostrophe, Toggle bar, global, quickshell:barToggle # Toggle bar

unbind = Super, Slash
bindd = Super, Plus, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet

bind = Super, B, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser

bind = Super+Shift, code:10, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspace 1 # [hidden]
